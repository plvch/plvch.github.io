name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy steps run only once the repo has the CLOUDFLARE_API_TOKEN secret.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/
        run: python3 build.py

      # Internal links resolve; no page loads anything from another host.
      - name: Check dist/
        run: python3 scripts/check_site.py

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          # Wrangler 4 needs Node 22.
          node-version: '22'

      # The plvch-site Worker (wrangler.jsonc). Until the cut-over it has no route on
      # plvch.com and answers only on its workers.dev URL.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.151.3 deploy

      # Preview at https://pr-<number>-plvch-site.<account>.workers.dev (noindex, see static/_headers).
      - name: Upload PR preview
        if: github.event_name == 'pull_request' && env.HAS_TOKEN == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.151.3 versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee "$RUNNER_TEMP/upload.log"
          echo "### Cloudflare Worker preview" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
